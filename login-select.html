<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | LAXMAN TELECOM</title>
<!-- इसकी जगह यह नया स्क्रिप्ट लोडर लगाएं -->
<script src="theme-loader.js"></script>
<link rel="stylesheet" href="auth-style.css">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="favicon-180.png">
<link rel="shortcut icon" href="favicon.ico">
<style>
  .login-select-wrap {
    max-width: 560px;
    margin: 60px auto;
    padding: 0 20px;
  }
  .login-select-wrap h2 { text-align: center; }
  .login-select-wrap p.sub { text-align: center; }
  .login-option-card {
    display: block;
    text-decoration: none;
    background: #fff;
    border: 1px solid #e2e6ef;
    border-radius: 16px;
    padding: 22px 24px;
    margin-top: 16px;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .login-option-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 24px rgba(13,42,92,0.12);
    border-color: #0d2a5c;
  }
  .login-option-card .title { font-size: 1.15rem; font-weight: 800; color: #0d2a5c; }
  .login-option-card .desc { font-size: 0.9rem; color: #666; margin-top: 4px; }
</style>
</head>
<body>

<header class="header">
  <div class="logo" style="display:flex; align-items:center; gap:14px;">
    <img src="laxman-telecom-icon-round.png" alt="Laxman Telecom logo" style="height:56px; width:56px;">
    <div>
      <h1>LAXMAN TELECOM</h1>
      <p>Your Trusted Digital Service Center</p>
    </div>
  </div>
  <button class="nav-toggle" onclick="toggleNav()" aria-label="Toggle menu">☰</button>
  <div class="nav-backdrop" id="navBackdrop" onclick="closeNav()"></div>
  <nav>
    <a href="index.html#home">Home</a>
    <a href="index.html#services">Services</a>
    <a href="index.html#about">About</a>
    <a href="index.html#contact">Contact</a>
  </nav>
</header>

<script>
function toggleNav() {
  document.querySelector('nav').classList.toggle('nav-open');
  document.getElementById('navBackdrop').classList.toggle('nav-open');
}
function closeNav() {
  document.querySelector('nav').classList.remove('nav-open');
  document.getElementById('navBackdrop').classList.remove('nav-open');
}
</script>

<div class="login-select-wrap">
  <h2>Login</h2>
  <p class="sub">Choose how you'd like to login</p>

  <a href="login.html" class="login-option-card">
    <div class="title">👤 Customer Login</div>
  </a>

  <a href="vendor.html" class="login-option-card">
    <div class="title">🤝 Vendor / Supplier Login</div>
  </a>

  <a href="login.html" class="login-option-card">
    <div class="title">🔑 Admin Login</div>
  </a>
</div>

</body>
</html>
