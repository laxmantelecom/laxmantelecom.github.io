<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | LAXMAN TELECOM</title>
<meta name="theme-color" content="#111318">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="favicon-180.png">
<link rel="shortcut icon" href="favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#111318;--acc:#ff8a00;--acc2:#ffb347;--cream:#fbf7f0;--line:#e9e1d3;--text:#2c2f38;--mute:#6b6f7b}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:Figtree,system-ui,sans-serif;color:var(--text);background:var(--cream);line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden}
h1,h2,h3,.brand b{font-family:'Bricolage Grotesque',system-ui,sans-serif;color:var(--ink);line-height:1.1}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.wrap{max-width:1140px;margin:0 auto;padding:0 20px}

/* header */
header{position:sticky;top:0;z-index:50;background:rgba(251,247,240,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:70px}
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:40px;height:40px;border-radius:50%}
.brand b{font-size:1.15rem}
.brand small{display:block;font-size:.68rem;color:var(--mute);margin-top:2px}
nav{display:flex;align-items:center;gap:6px;font-weight:500;font-size:.95rem}
nav a{padding:8px 14px;border-radius:999px;transition:background .2s}
nav a:hover{background:rgba(255,138,0,.12)}
nav a.on{color:#b35f00;font-weight:600}
.burger{display:none;background:none;border:1.5px solid var(--line);border-radius:10px;width:42px;height:42px;font-size:1.3rem;color:var(--ink);cursor:pointer}

/* hero band */
.band{background:var(--ink);position:relative;overflow:hidden;isolation:isolate;text-align:center;padding:64px 0 120px}
.band::before{content:'';position:absolute;inset:0;z-index:-1;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:56px 56px;mask-image:radial-gradient(ellipse at 50% 30%,#000,transparent 75%)}
.blob{position:absolute;border-radius:50%;filter:blur(80px);z-index:-1;animation:drift 12s ease-in-out infinite alternate}
.blob.a{width:340px;height:340px;background:rgba(255,138,0,.28);left:-90px;top:-90px}
.blob.b{width:320px;height:320px;background:rgba(124,58,237,.25);right:-70px;bottom:-110px;animation-delay:-5s}
@keyframes drift{to{transform:translate(60px,40px) scale(1.15)}}
.lock{width:68px;height:68px;border-radius:50%;margin:0 auto 20px;display:grid;place-items:center;font-size:1.9rem;background:linear-gradient(135deg,var(--acc),var(--acc2));box-shadow:0 16px 34px -8px var(--acc);animation:up .7s cubic-bezier(.2,.8,.2,1) both,float 6s ease-in-out 1s infinite}
@keyframes float{50%{transform:translateY(-8px)}}
.band h2{color:#fff;font-size:clamp(2.2rem,5vw,3.4rem);font-weight:800;letter-spacing:-.02em;animation:up .8s .1s cubic-bezier(.2,.8,.2,1) both}
.band p{color:#aab0bf;margin-top:12px;animation:up .8s .22s cubic-bezier(.2,.8,.2,1) both}
@keyframes up{from{opacity:0;transform:translateY(36px)}to{opacity:1;transform:none}}

/* option cards */
main{flex:1}
.opts{max-width:620px;margin:-70px auto 0;padding:0 20px 70px;display:grid;gap:18px;position:relative}
.opt{position:relative;overflow:hidden;display:flex;align-items:center;gap:20px;background:#fff;border:1px solid var(--line);border-radius:22px;padding:26px 26px;box-shadow:0 14px 34px -14px rgba(17,19,24,.25);transition:transform .3s,box-shadow .3s;animation:up .8s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d)}
.opt::before{content:'';position:absolute;left:0;right:0;top:0;height:6px;background:linear-gradient(90deg,var(--c1),var(--c2));transform:scaleX(0);transform-origin:left;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.opt::after{content:'';position:absolute;right:-60px;top:-60px;width:170px;height:170px;border-radius:50%;background:linear-gradient(135deg,var(--c1),var(--c2));opacity:.09;transition:transform .5s,opacity .3s}
.opt:hover,.opt:focus-visible{transform:translateY(-6px);box-shadow:0 24px 46px -12px rgba(17,19,24,.28)}
.opt:hover::before,.opt:focus-visible::before{transform:scaleX(1)}
.opt:hover::after{transform:scale(1.35);opacity:.15}
.opt .ic{position:relative;z-index:1;flex:none;width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,var(--c1),var(--c2));display:grid;place-items:center;font-size:1.8rem;box-shadow:0 14px 26px -6px var(--c1);transition:transform .35s}
.opt:hover .ic{transform:rotate(-10deg) scale(1.1)}
.opt .t{position:relative;z-index:1;flex:1;font-family:'Bricolage Grotesque';font-weight:700;font-size:1.25rem;color:var(--ink)}
.opt .go{position:relative;z-index:1;width:42px;height:42px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:1.1rem;color:var(--ink);transition:all .3s}
.opt:hover .go{background:var(--ink);color:#fff;border-color:var(--ink);transform:translateX(4px)}
.back{display:block;text-align:center;margin-top:10px;font-size:.92rem;color:var(--mute);animation:up .8s .6s both}
.back a{color:#b35f00;font-weight:600}.back a:hover{text-decoration:underline}

footer{background:#0b0c10;color:#8d94a6;text-align:center;padding:18px;font-size:.82rem}

@media(max-width:900px){
  .burger{display:block}
  nav{display:none;position:absolute;top:70px;left:0;right:0;flex-direction:column;align-items:stretch;gap:0;background:var(--cream);border-bottom:1px solid var(--line);padding:8px 20px 18px;box-shadow:0 14px 24px rgba(17,19,24,.1)}
  nav.open{display:flex}
  nav a{padding:13px 8px;border-radius:0;border-bottom:1px solid var(--line)}
}
@media(max-width:520px){.brand small{display:none}.opt{padding:22px 18px;gap:14px}.opt .ic{width:56px;height:56px}.opt .t{font-size:1.1rem}.band{padding:48px 0 110px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <a class="brand" href="index.html#home"><img src="laxman-telecom-icon-round.png" alt="Laxman Telecom logo"><span><b>LAXMAN TELECOM</b><small>Your Trusted Digital Service Center</small></span></a>
    <button class="burger" id="burger" aria-label="Toggle menu" aria-expanded="false">☰</button>
    <nav id="nav">
      <a href="index.html#home">Home</a>
      <a href="index.html#services">Services</a>
      <a href="index.html#about">About</a>
      <a href="index.html#contact">Contact</a>
    </nav>
  </div>
</header>

<main>
  <div class="band">
    <div class="blob a"></div><div class="blob b"></div>
    <div class="wrap">
      <div class="lock" aria-hidden="true">🔐</div>
      <h2>Login</h2>
      <p>Choose how you'd like to login</p>
    </div>
  </div>

  <div class="opts">
    <a href="login.html" class="opt" style="--c1:#7c3aed;--c2:#c026d3;--d:.3s"><div class="ic">👤</div><div class="t">Customer Login</div><div class="go">→</div></a>
    <a href="vendor.html" class="opt" style="--c1:#0f766e;--c2:#14b8a6;--d:.42s"><div class="ic">🤝</div><div class="t">Vendor / Supplier Login</div><div class="go">→</div></a>
    <a href="login.html" class="opt" style="--c1:#ea580c;--c2:#fb923c;--d:.54s"><div class="ic">🔑</div><div class="t">Admin Login</div><div class="go">→</div></a>
    <p class="back">← <a href="index.html#home">Back to Home</a></p>
  </div>
</main>

<footer>© 2026 LAXMAN TELECOM | All Rights Reserved</footer>

<script>
const nav=document.getElementById("nav"),bg=document.getElementById("burger");
bg.onclick=()=>{const o=nav.classList.toggle("open");bg.setAttribute("aria-expanded",o);bg.textContent=o?"✕":"☰"};
</script>
</body>
</html>
