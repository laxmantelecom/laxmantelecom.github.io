<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up | LAXMAN TELECOM</title>
  <meta name="theme-color" content="#111318">

  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="favicon-180.png">
  <link rel="shortcut icon" href="favicon.ico">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================
       Design tokens
       ========================================================== */
    :root {
      --ink: #111318;
      --accent: #ff8a00;
      --accent-light: #ffb347;
      --cream: #fbf7f0;
      --line: #e9e1d3;
      --text: #2c2f38;
      --muted: #6b6f7b;
    }

    /* ==========================================================
       Base
       ========================================================== */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      position: relative;
      min-height: 100vh;
      overflow-x: hidden;
      font-family: Figtree, system-ui, sans-serif;
      line-height: 1.6;
      color: var(--text);
      background: var(--cream);
      -webkit-font-smoothing: antialiased;
    }

    /* Dark banner behind the top of the page */
    body::before {
      content: '';
      position: absolute;
      z-index: -1;
      top: 0;
      left: 0;
      right: 0;
      height: 330px;
      background:
        radial-gradient(circle at 12% 10%, rgba(255, 138, 0, .32), transparent 38%),
        radial-gradient(circle at 92% 90%, rgba(124, 58, 237, .28), transparent 40%),
        linear-gradient(rgba(255, 255, 255, .04) 1px, transparent 1px) 0 0 / 56px 56px,
        linear-gradient(90deg, rgba(255, 255, 255, .04) 1px, transparent 1px) 0 0 / 56px 56px,
        var(--ink);
    }

    h1, h2 { font-family: 'Bricolage Grotesque', system-ui, sans-serif; line-height: 1.15; color: var(--ink); }
    a { color: inherit; text-decoration: none; }
    :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    .hidden { display: none !important; }

    @keyframes rise {
      from { opacity: 0; transform: translateY(34px); }
      to   { opacity: 1; transform: none; }
    }

    @keyframes float { 50% { transform: translateY(-8px); } }

    /* ==========================================================
       Header and navigation
       ========================================================== */
    .header {
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 70px;
      padding: 0 max(20px, calc((100% - 1140px) / 2));
      background: rgba(251, 247, 240, .92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
    }

    .brand { display: flex; align-items: center; gap: 10px; }
    .brand img { width: 40px; height: 40px; border-radius: 50%; }
    .brand h1 { font-size: 1.15rem; }
    .brand p { margin-top: 2px; font-size: .68rem; color: var(--muted); }

    nav { display: flex; align-items: center; gap: 6px; font-size: .95rem; font-weight: 500; }
    nav a { padding: 8px 14px; border-radius: 999px; transition: background .2s; }
    nav a:hover { background: rgba(255, 138, 0, .13); }

    .nav-toggle {
      display: none;
      width: 42px;
      height: 42px;
      font-size: 1.3rem;
      color: var(--ink);
      background: none;
      border: 1.5px solid var(--line);
      border-radius: 10px;
      cursor: pointer;
    }

    .nav-backdrop { display: none; position: fixed; inset: 0; z-index: 40; background: rgba(17, 19, 24, .45); }
    .nav-backdrop.nav-open { display: block; }

    /* ==========================================================
       Sign-up card
       ========================================================== */
    .auth-wrapper {
      width: 92%;
      max-width: 460px;
      margin: 56px auto 70px;
      padding: 34px 30px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 24px;
      box-shadow: 0 24px 50px -16px rgba(17, 19, 24, .35);
      animation: rise .8s cubic-bezier(.2, .8, .2, 1) both;
    }

    .auth-wrapper h2 { margin-bottom: 22px; text-align: center; font-size: 1.8rem; }

    .auth-wrapper h2::before {
      content: '✨';
      display: grid;
      place-items: center;
      width: 64px;
      height: 64px;
      margin: 0 auto 16px;
      font-size: 1.8rem;
      border-radius: 50%;
      background: linear-gradient(135deg, #0f766e, #14b8a6);
      box-shadow: 0 14px 26px -6px #0f766e;
      animation: float 6s ease-in-out 1s infinite;
    }

    /* Email / Mobile OTP switch */
    .tab-switch {
      display: flex;
      gap: 4px;
      margin-bottom: 20px;
      padding: 5px;
      background: var(--cream);
      border: 1px solid var(--line);
      border-radius: 999px;
    }

    .tab-switch button {
      flex: 1;
      padding: 10px;
      font: inherit;
      font-size: .92rem;
      font-weight: 600;
      color: var(--muted);
      background: transparent;
      border: 0;
      border-radius: 999px;
      cursor: pointer;
      transition: all .25s;
    }

    .tab-switch button:hover { color: var(--ink); }

    .tab-switch button.active {
      color: #fff;
      background: linear-gradient(135deg, #0f766e, #14b8a6);
      box-shadow: 0 8px 18px -6px #0f766e;
    }

    /* ==========================================================
       Forms and buttons
       ========================================================== */
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; margin-bottom: 6px; font-size: .88rem; font-weight: 600; }

    input[type=text],
    input[type=email],
    input[type=password],
    input[type=tel] {
      width: 100%;
      padding: 12px 14px;
      font: inherit;
      color: var(--ink);
      background: #fff;
      border: 1.5px solid var(--line);
      border-radius: 12px;
      transition: border-color .2s, box-shadow .2s;
    }

    input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(255, 138, 0, .15);
    }

    .password-field { position: relative; }
    .password-field input { padding-right: 44px; }

    .password-toggle {
      position: absolute;
      top: 50%;
      right: 12px;
      transform: translateY(-50%);
      font-size: 20px;
      cursor: pointer;
      user-select: none;
    }

    .error-msg, .success-msg { display: none; margin-bottom: 14px; padding: 11px 14px; font-size: .9rem; border-radius: 12px; }
    .error-msg   { color: #be123c; background: #fff1f2; border: 1px solid #fecdd3; }
    .success-msg { color: #166534; background: #ecfdf3; border: 1px solid #bbf7d0; }
    .error-msg.notice { color: #9a580a; background: #fff6e6; border: 1px solid #fde0ae; }

    .auth-btn {
      position: relative;
      overflow: hidden;
      width: 100%;
      padding: 14px;
      font: inherit;
      font-size: 1rem;
      font-weight: 700;
      color: var(--ink);
      background: linear-gradient(135deg, var(--accent), var(--accent-light));
      border: 0;
      border-radius: 999px;
      box-shadow: 0 10px 24px rgba(255, 138, 0, .35);
      cursor: pointer;
      transition: transform .2s;
    }

    .auth-btn:hover { transform: translateY(-3px); }

    .auth-btn::after {
      content: '';
      position: absolute;
      top: 0;
      left: -120%;
      width: 55%;
      height: 100%;
      background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .5), transparent);
      transform: skewX(-20deg);
      transition: left .6s;
    }

    .auth-btn:hover::after { left: 150%; }
    .auth-btn:disabled { opacity: .6; cursor: not-allowed; transform: none; box-shadow: none; }

    /* Outlined version used for the resend button */
    .auth-btn.secondary { margin-top: 10px; color: var(--ink); background: #fff; border: 1.5px solid var(--line); box-shadow: none; }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 18px 0 16px;
      font-size: .76rem;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .divider::before,
    .divider::after { content: ''; flex: 1; height: 1px; background: var(--line); }

    .google-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 12px 14px;
      font: inherit;
      font-weight: 700;
      color: var(--ink);
      background: #fff;
      border: 1.5px solid var(--line);
      border-radius: 999px;
      cursor: pointer;
      transition: transform .2s, box-shadow .2s, border-color .2s;
    }

    .google-btn:hover { transform: translateY(-2px); border-color: var(--accent); box-shadow: 0 10px 22px -12px rgba(17, 19, 24, .3); }
    .google-btn svg { display: block; width: 18px; height: 18px; }

    #recaptcha-container { display: flex; justify-content: center; margin: 12px 0; }

    .auth-link { margin-top: 18px; font-size: .9rem; text-align: center; color: var(--muted); }
    .auth-link a { font-weight: 600; color: #b35f00; }
    .auth-link a:hover { text-decoration: underline; }

    /* ==========================================================
       Responsive
       ========================================================== */
    @media (max-width: 900px) {
      .nav-toggle { display: block; }

      nav {
        display: none;
        position: absolute;
        top: 70px;
        left: 0;
        right: 0;
        flex-direction: column;
        align-items: stretch;
        gap: 0;
        padding: 8px 20px 18px;
        background: var(--cream);
        border-bottom: 1px solid var(--line);
        box-shadow: 0 14px 24px rgba(17, 19, 24, .12);
      }

      nav.nav-open { display: flex; }
      nav a { padding: 13px 8px; border-bottom: 1px solid var(--line); border-radius: 0; }
    }

    @media (max-width: 520px) {
      .brand p { display: none; }
      .auth-wrapper { padding: 28px 20px; }
    }

    /* The reCAPTCHA widget is 304px wide, so it is scaled down on very small phones */
    @media (max-width: 400px) {
      #recaptcha-container { margin: 12px -20px; transform: scale(.88); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>

<body>

  <header class="header">
    <div class="brand">
      <img src="laxman-telecom-icon-round.png" alt="Laxman Telecom logo">
      <div>
        <h1>LAXMAN TELECOM</h1>
        <p>Your Trusted Digital Service Center</p>
      </div>
    </div>

    <button class="nav-toggle" onclick="toggleNav()" aria-label="Toggle menu">☰</button>
    <div class="nav-backdrop" id="navBackdrop" onclick="closeNav()"></div>

    <nav>
      <a href="index.html#home">Home</a>
      <a href="index.html#services">Services</a>
      <a href="index.html#about">About</a>
      <a href="index.html#contact">Contact</a>
      <a href="login.html">Login</a>
    </nav>
  </header>

  <main class="auth-wrapper">
    <h2>Create Account</h2>

    <div class="tab-switch">
      <button id="tabEmailBtn" class="active" onclick="showTab('email')">Email</button>
      <button id="tabPhoneBtn" onclick="showTab('phone')">Mobile OTP</button>
    </div>

    <div class="error-msg" id="errorMsg"></div>
    <div class="success-msg" id="successMsg"></div>

    <!-- Email sign-up -->
    <form id="emailSignupForm">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="signupName" required placeholder="Your name">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="signupEmail" required placeholder="you@example.com">
      </div>
      <div class="form-group">
        <label>Mobile Number</label>
        <input type="tel" id="signupPhoneOptional" placeholder="10-digit number">
      </div>
      <div class="form-group">
        <label>Password</label>
        <div class="password-field">
          <input type="password" id="signupPassword" required minlength="6" placeholder="At least 6 characters">
          <span class="password-toggle" id="toggleSignupPassword">👁️</span>
        </div>
      </div>

      <button type="submit" class="auth-btn">Sign Up</button>
      <button type="button" class="auth-btn secondary hidden" id="resendVerificationBtn">Resend Verification Email</button>

      <div class="divider"><span>or</span></div>

      <button type="button" class="google-btn" id="googleSignupBtn" aria-label="Continue with Google">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.7 1.22 9.2 3.6l6.8-6.8C35.9 2.5 30.5 0 24 0 14.6 0 6.4 5.4 2.5 13.3l7.9 6.1C12.2 14.4 17.5 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v8.5h12.7c-.5 2.8-2.1 5.1-4.5 6.7l7.3 5.7c4.3-3.9 6.9-9.8 6.9-16.4z"/>
          <path fill="#FBBC05" d="M32.2 35.7c-1.9 1.3-4.4 2.1-8.2 2.1-6.5 0-11.9-4.3-13.8-10.1l-7.9 6.1C5.9 42 14.1 48 24 48c6.7 0 12.3-2.2 16.4-6.1l-8.2-6.2z"/>
          <path fill="#34A853" d="M10.2 27.7A14.8 14.8 0 0 1 9.5 24c0-1.7.3-3.3.8-4.8L2.5 13.3A23.9 23.9 0 0 0 0 24c0 3.9.9 7.5 2.5 10.7l7.7-6.9z"/>
        </svg>
        Continue with Google
      </button>
    </form>

    <!-- Mobile OTP sign-up -->
    <form id="phoneSignupForm" class="hidden">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="phoneSignupName" required placeholder="Your name">
      </div>
      <div class="form-group">
        <label>Mobile Number (with country code)</label>
        <input type="tel" id="phoneNumberInput" required placeholder="+919041880370">
      </div>
      <div id="recaptcha-container"></div>
      <button type="button" class="auth-btn" id="sendOtpBtn">Send OTP</button>

      <div class="form-group hidden" id="otpGroup" style="margin-top: 15px;">
        <label>Enter OTP</label>
        <input type="text" id="otpInput" placeholder="6-digit code">
        <button type="button" class="auth-btn" id="verifyOtpBtn" style="margin-top: 10px;">Verify &amp; Sign Up</button>
      </div>
    </form>

    <p class="auth-link">Already have an account? <a href="login.html">Login here</a></p>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="firebase-config.js"></script>

  <script>
    /* ==========================================================
       Helpers
       ========================================================== */
    const $ = (id) => document.getElementById(id);

    function toggleNav() {
      document.querySelector('nav').classList.toggle('nav-open');
      $('navBackdrop').classList.toggle('nav-open');
    }

    function closeNav() {
      document.querySelector('nav').classList.remove('nav-open');
      $('navBackdrop').classList.remove('nav-open');
    }

    function showTab(tab) {
      $('tabEmailBtn').classList.toggle('active', tab === 'email');
      $('tabPhoneBtn').classList.toggle('active', tab === 'phone');
      $('emailSignupForm').classList.toggle('hidden', tab !== 'email');
      $('phoneSignupForm').classList.toggle('hidden', tab !== 'phone');
    }

    function showError(msg) {
      const el = $('errorMsg');
      el.classList.remove('notice');
      el.textContent = msg;
      el.style.display = 'block';
      $('successMsg').style.display = 'none';
    }

    /** Same box as an error, in a calm amber colour, for service notices. */
    function showNotice(msg) {
      showError(msg);
      $('errorMsg').classList.add('notice');
    }

    function showSuccess(msg) {
      const el = $('successMsg');
      el.textContent = msg;
      el.style.display = 'block';
      $('errorMsg').style.display = 'none';
    }

    function goToDashboard() {
      setTimeout(() => { window.location.href = 'dashboard.html'; }, 800);
    }

    $('toggleSignupPassword').addEventListener('click', function () {
      const field = $('signupPassword');
      const hidden = field.type === 'password';
      field.type = hidden ? 'text' : 'password';
      this.textContent = hidden ? '🙈' : '👁️';
    });

    /* ==========================================================
       User profile in the database
       ========================================================== */
    function saveUserProfile(uid, data) {
      return db.ref('users/' + uid).set({
        ...data,
        createdAt: firebase.database.ServerValue.TIMESTAMP
      });
    }

    /** Creates the profile only when it does not exist, so a returning user is never overwritten. */
    function ensureUserProfile(uid, data) {
      return db.ref('users/' + uid).once('value').then((snap) => {
        if (!snap.exists()) return saveUserProfile(uid, data);
      });
    }

    /* ==========================================================
       Email verification (with a 60 second resend cooldown)
       ========================================================== */
    let resendTimer = null;

    function stopResendTimer() {
      if (resendTimer) {
        clearInterval(resendTimer);
        resendTimer = null;
      }
    }

    function startResendCooldown() {
      const button = $('resendVerificationBtn');
      let secondsLeft = 60;

      stopResendTimer();
      button.classList.remove('hidden');
      button.disabled = true;
      button.textContent = 'Resend in ' + secondsLeft + 's';

      resendTimer = setInterval(() => {
        secondsLeft -= 1;

        if (secondsLeft <= 0) {
          stopResendTimer();
          button.disabled = false;
          button.textContent = 'Resend Verification Email';
          return;
        }

        button.textContent = 'Resend in ' + secondsLeft + 's';
      }, 1000);
    }

    function sendVerificationEmail(user) {
      user.sendEmailVerification()
        .then(() => {
          window.open('https://mail.google.com/', '_blank');
          showSuccess('A verification email has been sent. Please check your inbox.');
          startResendCooldown();
        })
        .catch((err) => showError(err.message));
    }

    $('resendVerificationBtn').addEventListener('click', () => {
      const user = auth.currentUser;
      if (!user) {
        showError('Please sign in first.');
        return;
      }
      sendVerificationEmail(user);
    });

    /* ==========================================================
       Sign up with email
       ========================================================== */
    $('emailSignupForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const name = $('signupName').value.trim();
      const email = $('signupEmail').value.trim();
      const phone = $('signupPhoneOptional').value.trim();
      const password = $('signupPassword').value;

      auth.createUserWithEmailAndPassword(email, password)
        .then((cred) => saveUserProfile(cred.user.uid, { name, email, phone }).then(() => cred.user))
        .then(sendVerificationEmail)
        .catch((err) => showError(err.message));
    });

    /* ==========================================================
       Sign up with Google
       ========================================================== */
    $('googleSignupBtn').addEventListener('click', () => {
      const provider = new firebase.auth.GoogleAuthProvider();
      provider.setCustomParameters({ prompt: 'select_account' });

      auth.signInWithPopup(provider)
        .then((result) => {
          const user = result.user;
          return ensureUserProfile(user.uid, {
            name: user.displayName || $('signupName').value.trim(),
            email: user.email || '',
            phone: user.phoneNumber || $('signupPhoneOptional').value.trim()
          });
        })
        .then(() => {
          showSuccess('Google sign-up successful! Redirecting...');
          goToDashboard();
        })
        .catch((err) => showError(err.message));
    });

    /* ==========================================================
       Sign up with mobile OTP
       ========================================================== */
    /** Shown when OTP sending is not available yet (for example while SMS billing is not set up). */
    const OTP_NOTICE = 'Mobile OTP is being set up right now. Our team is working on it and it will be available very soon. Please use Email or Google for now.';

    /** Firebase codes that mean the SMS service itself is not ready, not that the customer did something wrong. */
    const OTP_UNAVAILABLE_CODES = [
      'auth/billing-not-enabled',
      'auth/quota-exceeded',
      'auth/operation-not-allowed',
      'auth/unauthorized-domain',
      'auth/internal-error',
      'auth/app-not-authorized'
    ];

    /** Turns Firebase phone sign-in error codes into a short, customer-friendly message. */
    function otpErrorMessage(err) {
      const messages = {
        'auth/invalid-phone-number': 'Enter the number with country code and no spaces, for example +919041880370.',
        'auth/missing-phone-number': 'Please enter your mobile number.',
        'auth/too-many-requests': 'Too many attempts. Please wait a while and try again.',
        'auth/captcha-check-failed': 'The security check failed. Please try again.',
        'auth/invalid-app-credential': 'The security check was not accepted. Reload the page and try again.',
        'auth/network-request-failed': 'Network error. Please check your internet connection.',
        'auth/invalid-verification-code': 'Wrong OTP. Please check the code and try again.',
        'auth/code-expired': 'This OTP has expired. Please request a new one.'
      };
      return messages[err.code] || 'We could not complete this right now. Please try again in a little while, or use Email or Google.';
    }

    /** Shows an amber notice when the OTP service is unavailable, otherwise a normal error. */
    function showOtpProblem(err) {
      if (OTP_UNAVAILABLE_CODES.includes(err.code)) {
        showNotice(OTP_NOTICE);
      } else {
        showError(otpErrorMessage(err));
      }
    }
    
    /** A used or failed reCAPTCHA cannot be reused, so it is removed and drawn fresh on the next try. */
    function resetRecaptcha() {
      if (window.recaptchaVerifier) {
        window.recaptchaVerifier.clear();
        window.recaptchaVerifier = null;
      }
      document.getElementById('recaptcha-container').innerHTML = '';
    }
    
    window.recaptchaVerifier = null;

    $('sendOtpBtn').addEventListener('click', () => {
      const name = $('phoneSignupName').value.trim();
      const phoneNumber = $('phoneNumberInput').value.trim();

      if (!name) {
        showError('Please enter your name first.');
        return;
      }
      if (!phoneNumber.startsWith('+')) {
        showError('Include country code, e.g. +91...');
        return;
      }

      if (!window.recaptchaVerifier) {
        window.recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', { size: 'normal' });
      }

      auth.signInWithPhoneNumber(phoneNumber, window.recaptchaVerifier)
        .then((confirmationResult) => {
          window.confirmationResult = confirmationResult;
          $('otpGroup').classList.remove('hidden');
          showSuccess('OTP sent! Please check your SMS.');
        })
        .catch((err) => {
          console.error('OTP send failed:', err.code, err.message);
          resetRecaptcha();
          showOtpProblem(err);
        });
    });

    $('verifyOtpBtn').addEventListener('click', () => {
      const code = $('otpInput').value.trim();
      const name = $('phoneSignupName').value.trim();
      const phoneNumber = $('phoneNumberInput').value.trim();

      if (!window.confirmationResult) {
        showError('Please request an OTP first.');
        return;
      }

      window.confirmationResult.confirm(code)
        .then((result) => saveUserProfile(result.user.uid, { name, phone: phoneNumber, email: '' }))
        .then(() => {
          showSuccess('Account created! Redirecting...');
          goToDashboard();
        })
        .catch((err) => showError(otpErrorMessage(err)));
    });
  </script>

</body>
</html>
