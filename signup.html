<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up | LAXMAN TELECOM</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="auth-style.css">
</head>
<body>

<header class="header">
  <div class="logo">
    <h1>LAXMAN TELECOM</h1>
    <p>Your Trusted Digital Service Center</p>
  </div>
  <nav>
    <a href="index.html#home">Home</a>
    <a href="index.html#services">Services</a>
    <a href="index.html#about">About</a>
    <a href="index.html#contact">Contact</a>
    <a href="login.html">Login</a>
  </nav>
</header>

<div class="auth-wrapper">
  <h2>Create Account</h2>
  <p class="sub">Sign up to track your service requests</p>

  <div class="tab-switch">
    <button id="tabEmailBtn" class="active" onclick="showTab('email')">Email</button>
    <button id="tabPhoneBtn" onclick="showTab('phone')">Mobile OTP</button>
  </div>

  <div class="error-msg" id="errorMsg"></div>
  <div class="success-msg" id="successMsg"></div>

  <!-- EMAIL SIGNUP -->
  <form id="emailSignupForm">
    <div class="form-group">
      <label>Full Name</label>
      <input type="text" id="signupName" required placeholder="Your name">
    </div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="signupEmail" required placeholder="you@example.com">
    </div>
    <div class="form-group">
      <label>Mobile Number</label>
      <input type="tel" id="signupPhoneOptional" placeholder="10-digit number">
    </div>
    <div class="form-group">
      <label>Password</label>
      <div style="position:relative;">
        <input type="password" id="signupPassword" required placeholder="At least 6 characters" minlength="6" style="width:100%; box-sizing:border-box; padding-right:44px;">
        <span id="toggleSignupPassword" style="position:absolute; right:12px; top:50%; transform:translateY(-50%); cursor:pointer; font-size:20px; user-select:none;">👁️</span>
      </div>
    </div>
    <button type="submit" class="auth-btn">Sign Up</button>
  </form>

  <!-- PHONE SIGNUP -->
  <form id="phoneSignupForm" class="hidden">
    <div class="form-group">
      <label>Full Name</label>
      <input type="text" id="phoneSignupName" required placeholder="Your name">
    </div>
    <div class="form-group">
      <label>Mobile Number (with country code)</label>
      <input type="tel" id="phoneNumberInput" required placeholder="+919041880370">
    </div>
    <div id="recaptcha-container"></div>
    <button type="button" class="auth-btn" id="sendOtpBtn">Send OTP</button>

    <div class="form-group hidden" id="otpGroup" style="margin-top:15px;">
      <label>Enter OTP</label>
      <input type="text" id="otpInput" placeholder="6-digit code">
      <button type="button" class="auth-btn" id="verifyOtpBtn" style="margin-top:10px;">Verify & Sign Up</button>
    </div>
  </form>

  <p class="auth-link">Already have an account? <a href="login.html">Login here</a></p>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
function showTab(tab) {
  document.getElementById('tabEmailBtn').classList.toggle('active', tab === 'email');
  document.getElementById('tabPhoneBtn').classList.toggle('active', tab === 'phone');
  document.getElementById('emailSignupForm').classList.toggle('hidden', tab !== 'email');
  document.getElementById('phoneSignupForm').classList.toggle('hidden', tab !== 'phone');
}

document.getElementById('toggleSignupPassword').addEventListener('click', function () {
  const pwd = document.getElementById('signupPassword');
  if (pwd.type === 'password') {
    pwd.type = 'text';
    this.textContent = '🙈';
  } else {
    pwd.type = 'password';
    this.textContent = '👁️';
  }
});

function showError(msg) {
  const el = document.getElementById('errorMsg');
  el.textContent = msg;
  el.style.display = 'block';
  document.getElementById('successMsg').style.display = 'none';
}
function showSuccess(msg) {
  const el = document.getElementById('successMsg');
  el.textContent = msg;
  el.style.display = 'block';
  document.getElementById('errorMsg').style.display = 'none';
}

function saveUserProfile(uid, data) {
  return db.ref('users/' + uid).set({
    ...data,
    createdAt: firebase.database.ServerValue.TIMESTAMP
  });
}

// ---- EMAIL SIGNUP ----
document.getElementById('emailSignupForm').addEventListener('submit', function (e) {
  e.preventDefault();
  const name = document.getElementById('signupName').value.trim();
  const email = document.getElementById('signupEmail').value.trim();
  const phone = document.getElementById('signupPhoneOptional').value.trim();
  const password = document.getElementById('signupPassword').value;

  auth.createUserWithEmailAndPassword(email, password)
    .then((cred) => saveUserProfile(cred.user.uid, { name, email, phone }))
    .then(() => {
      showSuccess('Account created! Redirecting...');
      setTimeout(() => { window.location.href = 'dashboard.html'; }, 800);
    })
    .catch((err) => showError(err.message));
});

// ---- PHONE SIGNUP ----
window.recaptchaVerifier = null;

document.getElementById('sendOtpBtn').addEventListener('click', function () {
  const name = document.getElementById('phoneSignupName').value.trim();
  const phoneNumber = document.getElementById('phoneNumberInput').value.trim();
  if (!name) { showError('Please enter your name first.'); return; }
  if (!phoneNumber.startsWith('+')) { showError('Include country code, e.g. +91...'); return; }

  if (!window.recaptchaVerifier) {
    window.recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', { size: 'normal' }, auth);
  }

  auth.signInWithPhoneNumber(phoneNumber, window.recaptchaVerifier)
    .then((confirmationResult) => {
      window.confirmationResult = confirmationResult;
      document.getElementById('otpGroup').classList.remove('hidden');
      showSuccess('OTP sent! Please check your SMS.');
    })
    .catch((err) => showError(err.message));
});

document.getElementById('verifyOtpBtn').addEventListener('click', function () {
  const code = document.getElementById('otpInput').value.trim();
  const name = document.getElementById('phoneSignupName').value.trim();
  const phoneNumber = document.getElementById('phoneNumberInput').value.trim();

  window.confirmationResult.confirm(code)
    .then((result) => saveUserProfile(result.user.uid, { name, phone: phoneNumber, email: '' }))
    .then(() => {
      showSuccess('Account created! Redirecting...');
      setTimeout(() => { window.location.href = 'dashboard.html'; }, 800);
    })
    .catch((err) => showError(err.message));
});
</script>

</body>
</html>
