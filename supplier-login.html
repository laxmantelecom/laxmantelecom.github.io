<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Supplier Login | LAXMAN TELECOM</title>
<meta name="theme-color" content="#111318">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="favicon-180.png">
<link rel="shortcut icon" href="favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#111318;--acc:#ff8a00;--acc2:#ffb347;--cream:#fbf7f0;--line:#e9e1d3;--text:#2c2f38;--mute:#6b6f7b}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:Figtree,system-ui,sans-serif;color:var(--text);background:var(--cream);line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh;position:relative;overflow-x:hidden}
body::before{content:'';position:absolute;z-index:-1;left:0;right:0;top:0;height:330px;background:radial-gradient(circle at 12% 10%,rgba(255,138,0,.32),transparent 38%),radial-gradient(circle at 92% 90%,rgba(124,58,237,.28),transparent 40%),linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px) 0 0/56px 56px,linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px) 0 0/56px 56px,var(--ink)}
h1,h2,h3{font-family:'Bricolage Grotesque',system-ui,sans-serif;color:var(--ink);line-height:1.15}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.hidden{display:none!important}
@keyframes up{from{opacity:0;transform:translateY(34px)}to{opacity:1;transform:none}}

/* header */
.header{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;height:70px;padding:0 max(20px,calc((100% - 1140px)/2));background:rgba(251,247,240,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:10px}
.logo img{border-radius:50%;height:40px;width:40px}
.logo h1{font-size:1.15rem}
.logo p{font-size:.68rem;color:var(--mute);margin-top:2px}
nav{display:flex;align-items:center;gap:2px;font-weight:500;font-size:.9rem}
nav a{padding:8px 12px;border-radius:999px;transition:background .2s}
nav a:hover{background:rgba(255,138,0,.13)}
.nav-toggle{display:none;place-items:center;background:none;border:1.5px solid var(--line);border-radius:10px;width:42px;height:42px;color:var(--ink);cursor:pointer}
.nav-backdrop{display:none;position:fixed;inset:0;background:rgba(17,19,24,.45);z-index:40}
.nav-backdrop.nav-open{display:block}
@media(max-width:900px){
  .nav-toggle{display:grid}
  nav{display:none;position:absolute;top:70px;left:0;right:0;flex-direction:column;align-items:stretch;gap:0;background:var(--cream);border-bottom:1px solid var(--line);padding:8px 20px 18px;box-shadow:0 14px 24px rgba(17,19,24,.12)}
  nav.nav-open{display:flex}
  nav a{border-radius:0;border-bottom:1px solid var(--line);padding:13px 8px}
}

/* login card */
.auth-wrapper{width:92%;max-width:440px;margin:56px auto 70px;padding:34px 30px;background:#fff;border:1px solid var(--line);border-radius:24px;box-shadow:0 24px 50px -16px rgba(17,19,24,.35);animation:up .8s cubic-bezier(.2,.8,.2,1) both}
.auth-wrapper h2{text-align:center;font-size:1.8rem;margin-bottom:20px}
.auth-wrapper h2::before{content:'🤝';display:grid;place-items:center;width:64px;height:64px;margin:0 auto 16px;border-radius:50%;font-size:1.8rem;background:linear-gradient(135deg,#0f766e,#14b8a6);box-shadow:0 14px 26px -6px #0f766e}
.auth-link{text-align:center;font-size:.84rem;color:var(--mute);margin-top:16px}

/* forms */
.form-group{margin-bottom:14px}
.form-group label{display:block;font-weight:600;font-size:.88rem;margin-bottom:6px}
input[type=text],input[type=email],input[type=password]{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;font:inherit;color:var(--ink);background:#fff;transition:border-color .2s,box-shadow .2s}
input:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 4px rgba(255,138,0,.15)}
.error-msg,.success-msg{display:none;border-radius:12px;padding:11px 14px;margin-bottom:14px;font-size:.9rem}
.error-msg{background:#fff1f2;color:#be123c;border:1px solid #fecdd3}
.success-msg{background:#ecfdf3;color:#166534;border:1px solid #bbf7d0}
.auth-btn{position:relative;overflow:hidden;width:100%;padding:14px;font:inherit;font-weight:700;font-size:1rem;color:var(--ink);background:linear-gradient(135deg,var(--acc),var(--acc2));border:0;border-radius:999px;cursor:pointer;box-shadow:0 10px 24px rgba(255,138,0,.35);transition:transform .2s}
.auth-btn:hover{transform:translateY(-3px)}
.auth-btn:disabled{opacity:.6;cursor:not-allowed;transform:none}
.auth-btn::after{content:'';position:absolute;top:0;left:-120%;width:55%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.5),transparent);transform:skewX(-20deg);transition:left .6s}
.auth-btn:hover::after{left:150%}
.forgot-row{margin:-4px 0 16px;text-align:right}
.forgot-row a,.back-row a{font-size:.88rem;font-weight:600;color:#b35f00}
.forgot-row a:hover,.back-row a:hover{text-decoration:underline}
.back-row{margin-top:16px;text-align:center}
.divider{display:flex;align-items:center;gap:12px;margin:18px 0 16px;font-size:.76rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--line)}
.google-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:12px 14px;font:inherit;font-weight:700;color:var(--ink);background:#fff;border:1.5px solid var(--line);border-radius:999px;cursor:pointer;transition:transform .2s,box-shadow .2s,border-color .2s}
.google-btn:hover{transform:translateY(-2px);border-color:var(--acc);box-shadow:0 10px 22px -12px rgba(17,19,24,.3)}
.google-btn svg{display:block;width:18px;height:18px}
.reset-title{margin-bottom:4px;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:1.25rem;color:var(--ink)}
.reset-text{margin-bottom:16px;font-size:.9rem;color:var(--mute)}

@media(max-width:520px){.logo p{display:none}.auth-wrapper{padding:28px 20px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header class="header">
  <a class="logo" href="index.html#home">
    <img src="laxman-telecom-icon-round.png" alt="Laxman Telecom logo">
    <div>
      <h1>LAXMAN TELECOM</h1>
      <p>Supplier Portal</p>
    </div>
  </a>

  <button class="nav-toggle" onclick="toggleNav()" aria-label="Toggle menu">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M3 12H21M3 6H21M3 18H21" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>

  <div class="nav-backdrop" id="navBackdrop" onclick="closeNav()"></div>
  <nav>
    <a href="index.html#home" onclick="closeNav()">Home</a>
    <a href="index.html#contact" onclick="closeNav()">Contact</a>
    <a href="login-select.html" onclick="closeNav()">All Logins</a>
  </nav>
</header>

<div class="auth-wrapper">
  <h2>Supplier Login</h2>

  <div class="error-msg" id="errorMsg"></div>
  <div class="success-msg" id="successMsg"></div>

  <form id="supplierLoginForm">
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="supplierEmail" required placeholder="you@example.com" autocomplete="username">
    </div>
    <div class="form-group">
      <label>Password</label>
      <div style="position:relative;">
        <input type="password" id="supplierPassword" required placeholder="Your password" autocomplete="current-password" style="padding-right:44px;">
        <span id="toggleSupplierPassword" style="position:absolute; right:12px; top:50%; transform:translateY(-50%); cursor:pointer; font-size:20px; user-select:none;">👁️</span>
      </div>
    </div>
    <div class="forgot-row"><a href="#" id="forgotLink">Forgot password?</a></div>
    <button type="submit" class="auth-btn" id="loginBtn">Login</button>

    <div class="divider"><span>or</span></div>

    <button type="button" class="google-btn" id="googleLoginBtn" aria-label="Continue with Google">
      <svg viewBox="0 0 48 48" aria-hidden="true">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.7 1.22 9.2 3.6l6.8-6.8C35.9 2.5 30.5 0 24 0 14.6 0 6.4 5.4 2.5 13.3l7.9 6.1C12.2 14.4 17.5 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v8.5h12.7c-.5 2.8-2.1 5.1-4.5 6.7l7.3 5.7c4.3-3.9 6.9-9.8 6.9-16.4z"/>
        <path fill="#FBBC05" d="M32.2 35.7c-1.9 1.3-4.4 2.1-8.2 2.1-6.5 0-11.9-4.3-13.8-10.1l-7.9 6.1C5.9 42 14.1 48 24 48c6.7 0 12.3-2.2 16.4-6.1l-8.2-6.2z"/>
        <path fill="#34A853" d="M10.2 27.7A14.8 14.8 0 0 1 9.5 24c0-1.7.3-3.3.8-4.8L2.5 13.3A23.9 23.9 0 0 0 0 24c0 3.9.9 7.5 2.5 10.7l7.7-6.9z"/>
      </svg>
      Continue with Google
    </button>
  </form>

  <form id="resetForm" class="hidden">
    <h3 class="reset-title">Reset password</h3>
    <p class="reset-text">We'll email you a reset link.</p>
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="resetEmail" required placeholder="you@example.com">
    </div>
    <button type="submit" class="auth-btn" id="resetBtn">Send Reset Link</button>
    <p class="back-row"><a href="#" id="backToLogin">&larr; Back to login</a></p>
  </form>
  <p class="auth-link">This login is only for approved suppliers. Contact Laxman Telecom if you need access.</p>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
const DASHBOARD_URL = 'supplier.html';

function toggleNav() {
  document.querySelector('nav').classList.toggle('nav-open');
  document.getElementById('navBackdrop').classList.toggle('nav-open');
}
function closeNav() {
  document.querySelector('nav').classList.remove('nav-open');
  document.getElementById('navBackdrop').classList.remove('nav-open');
}

function showError(msg) {
  const el = document.getElementById('errorMsg');
  el.textContent = msg;
  el.style.display = 'block';
  document.getElementById('successMsg').style.display = 'none';
}
function showSuccess(msg) {
  const el = document.getElementById('successMsg');
  el.textContent = msg;
  el.style.display = 'block';
  document.getElementById('errorMsg').style.display = 'none';
}

document.getElementById('toggleSupplierPassword').addEventListener('click', function () {
  const pwd = document.getElementById('supplierPassword');
  if (pwd.type === 'password') {
    pwd.type = 'text';
    this.textContent = '🙈';
  } else {
    pwd.type = 'password';
    this.textContent = '👁️';
  }
});

// While a login is in progress, the page handles the redirect itself.
let loginInProgress = false;

/** Opens supplier.html when the signed-in account is a registered supplier, otherwise signs out. */
function handleSupplierAccount(user, snap) {
  if (!snap.val()) {
    showError('This login is not registered as a supplier account. Please contact Laxman Telecom.');
    loginInProgress = false;
    document.getElementById('loginBtn').disabled = false;
    return auth.signOut();
  }
  // Fresh login: the MPIN screen is skipped once on the dashboard page.
  try { sessionStorage.setItem('supplierFreshLogin', user.uid); } catch (err) { /* storage blocked */ }
  showSuccess('Login successful! Redirecting...');
  setTimeout(() => { window.location.href = DASHBOARD_URL; }, 400);
}

function checkSupplier(user) {
  return db.ref('vendorAccounts/' + user.uid).once('value').then((snap) => handleSupplierAccount(user, snap));
}

document.getElementById('supplierLoginForm').addEventListener('submit', function (e) {
  e.preventDefault();
  const email = document.getElementById('supplierEmail').value.trim();
  const password = document.getElementById('supplierPassword').value;
  document.getElementById('loginBtn').disabled = true;
  loginInProgress = true;

  auth.signInWithEmailAndPassword(email, password)
    .then((cred) => checkSupplier(cred.user))
    .catch((err) => {
      loginInProgress = false;
      document.getElementById('loginBtn').disabled = false;
      showError(err.message);
    });
});

// --- Continue with Google ----------------------------------------
document.getElementById('googleLoginBtn').addEventListener('click', () => {
  const provider = new firebase.auth.GoogleAuthProvider();
  provider.setCustomParameters({ prompt: 'select_account' });
  loginInProgress = true;

  auth.signInWithPopup(provider)
    .then((result) => checkSupplier(result.user))
    .catch((err) => {
      loginInProgress = false;
      const messages = {
        'auth/popup-closed-by-user': 'The Google window was closed before login finished.',
        'auth/cancelled-popup-request': 'Another Google window is already open.',
        'auth/popup-blocked': 'Your browser blocked the Google window. Please allow pop-ups for this site.',
        'auth/unauthorized-domain': 'This website is not in the Firebase authorized domains list.',
        'auth/operation-not-allowed': 'Google sign-in is turned off in Firebase Authentication.'
      };
      showError(messages[err.code] || err.message);
    });
});

// Returning supplier who is still signed in: go straight to the dashboard
auth.onAuthStateChanged((user) => {
  if (!user || loginInProgress) return;
  db.ref('vendorAccounts/' + user.uid).once('value').then((snap) => {
    if (snap.val()) window.location.href = DASHBOARD_URL;
  });
});

// --- Forgot password ---------------------------------------------
let resetTimer = null;

function showResetForm(show) {
  document.getElementById('supplierLoginForm').classList.toggle('hidden', show);
  document.getElementById('resetForm').classList.toggle('hidden', !show);
  document.getElementById('errorMsg').style.display = 'none';
  document.getElementById('successMsg').style.display = 'none';

  if (show) {
    document.getElementById('resetEmail').value = document.getElementById('supplierEmail').value.trim();
  }
}

/** Disables the send button for 60 seconds so reset emails cannot be spammed. */
function startResetCooldown() {
  const button = document.getElementById('resetBtn');
  let secondsLeft = 60;

  clearInterval(resetTimer);
  button.disabled = true;
  button.textContent = 'Resend in ' + secondsLeft + 's';

  resetTimer = setInterval(() => {
    secondsLeft -= 1;
    if (secondsLeft <= 0) {
      clearInterval(resetTimer);
      button.disabled = false;
      button.textContent = 'Send Reset Link';
      return;
    }
    button.textContent = 'Resend in ' + secondsLeft + 's';
  }, 1000);
}

document.getElementById('forgotLink').addEventListener('click', (e) => {
  e.preventDefault();
  showResetForm(true);
});

document.getElementById('backToLogin').addEventListener('click', (e) => {
  e.preventDefault();
  showResetForm(false);
});

document.getElementById('resetForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const email = document.getElementById('resetEmail').value.trim();

  function linkSent() {
    showSuccess('Reset link sent. Please check your inbox and spam folder.');
    startResetCooldown();
  }

  auth.sendPasswordResetEmail(email)
    .then(linkSent)
    .catch((err) => {
      // The same message is shown when no account exists, so emails cannot be probed.
      if (err.code === 'auth/user-not-found') {
        linkSent();
      } else {
        showError(err.message);
      }
    });
});
</script>

</body>
</html>
