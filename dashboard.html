<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Account | LAXMAN TELECOM</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="auth-style.css">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="favicon-180.png">
<link rel="shortcut icon" href="favicon.ico">
</head>
<body>

<header class="header">
  <div class="logo" style="display:flex; align-items:center; gap:14px;">
    <img src="laxman-telecom-icon-round.png" alt="Laxman Telecom logo" style="height:56px; width:56px;">
    <div>
      <h1>LAXMAN TELECOM</h1>
      <p>Your Trusted Digital Service Center</p>
    </div>
  </div>
  <button class="nav-toggle" onclick="toggleNav()" aria-label="Toggle menu">☰</button>
  <div class="nav-backdrop" id="navBackdrop" onclick="closeNav()"></div>
  <nav>
    <a href="index.html#home">Home</a>
    <a href="index.html#services">Services</a>
    <a href="index.html#about">About</a>
    <a href="index.html#contact">Contact</a>
  </nav>
</header>

<script>
function toggleNav() {
  document.querySelector('nav').classList.toggle('nav-open');
  document.getElementById('navBackdrop').classList.toggle('nav-open');
}
function closeNav() {
  document.querySelector('nav').classList.remove('nav-open');
  document.getElementById('navBackdrop').classList.remove('nav-open');
}
</script>

<div class="dash-wrapper">

  <div class="dash-card">
    <div class="dash-top">
      <h2>My Profile</h2>
      <button class="logout-btn" onclick="doLogout()">Logout</button>
    </div>
    <p><strong>Name:</strong> <span id="pName">-</span></p>
    <p><strong>Email:</strong> <span id="pEmail">-</span></p>
    <p><strong>Phone:</strong> <span id="pPhone">-</span></p>
  </div>

  <div class="dash-card">
    <h2>New Service Request</h2>
    <div class="error-msg" id="errorMsg"></div>
    <div class="success-msg" id="successMsg"></div>
    <form id="requestForm">
      <div class="form-group">
        <label>Service Needed</label>
        <select id="reqService" required>
          <option value="">-- Select a service --</option>
          <option>Mobile Repair</option>
          <option>Aadhaar & PAN Services</option>
          <option>Punjab Smart Ration Card</option>
          <option>Voter ID Services</option>
          <option>Ayushman Bharat</option>
          <option>PM-KISAN</option>
          <option>e-Shram & Labour</option>
          <option>MSME (Udyam)</option>
          <option>Banking Services</option>
          <option>Travel Booking</option>
          <option>Printing Services</option>
          <option>Other</option>
        </select>
      </div>
      <div class="form-group">
        <label>Details</label>
        <textarea id="reqMessage" rows="3" placeholder="Describe what you need..."></textarea>
      </div>
      <div class="form-group">
        <label>Upload Document (optional, max 5MB — photo, PDF, Aadhaar, etc.)</label>
        <input type="file" id="reqFile" accept="image/*,.pdf">
      </div>
      <div id="uploadProgress" style="display:none;font-size:13px;color:#666;margin-bottom:10px;">Uploading...</div>
      <button type="submit" class="auth-btn" id="submitReqBtn">Submit Request</button>
    </form>
  </div>

  <div class="dash-card">
    <h2>My Requests</h2>
    <div id="requestsList">
      <p>Loading...</p>
    </div>
  </div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
function showError(msg) {
  const el = document.getElementById('errorMsg');
  el.textContent = msg;
  el.style.display = 'block';
}
function showSuccess(msg) {
  const el = document.getElementById('successMsg');
  el.textContent = msg;
  el.style.display = 'block';
  setTimeout(() => { el.style.display = 'none'; }, 3000);
}

function doLogout() {
  auth.signOut().then(() => { window.location.href = 'login.html'; });
}

let currentUser = null;

auth.onAuthStateChanged((user) => {
  if (!user) {
    window.location.href = 'login.html';
    return;
  }
  if (user.email === ADMIN_EMAIL) {
    window.location.href = 'admin.html';
    return;
  }
  currentUser = user;
  loadProfile(user.uid);
  loadRequests(user.uid);
});

function loadProfile(uid) {
  db.ref('users/' + uid).once('value').then((snap) => {
    const data = snap.val() || {};
    document.getElementById('pName').textContent = data.name || '-';
    document.getElementById('pEmail').textContent = data.email || '-';
    document.getElementById('pPhone').textContent = data.phone || '-';
  });
}

const CLOUDINARY_CLOUD_NAME = 'xugjl6tk';
const CLOUDINARY_UPLOAD_PRESET = 'wlfm48rw';

function uploadToCloudinary(file) {
  const formData = new FormData();
  formData.append('file', file);
  formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);

  return fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/auto/upload`, {
    method: 'POST',
    body: formData
  })
  .then((res) => res.json())
  .then((data) => {
    if (data.secure_url) return data.secure_url;
    throw new Error(data.error ? data.error.message : 'Upload failed');
  });
}

document.getElementById('requestForm').addEventListener('submit', function (e) {
  e.preventDefault();
  const service = document.getElementById('reqService').value;
  const message = document.getElementById('reqMessage').value.trim();
  const fileInput = document.getElementById('reqFile');
  const file = fileInput.files[0];
  if (!service) { showError('Please select a service.'); return; }

  if (file && file.size > 5 * 1024 * 1024) {
    showError('File is too large. Max size is 5MB.');
    return;
  }

  const submitBtn = document.getElementById('submitReqBtn');
  submitBtn.disabled = true;

  function saveRequest(documentUrl, documentName) {
    return db.ref('requests/' + currentUser.uid).push({
      service,
      message,
      status: 'Pending',
      documentUrl: documentUrl || null,
      documentName: documentName || null,
      createdAt: firebase.database.ServerValue.TIMESTAMP
    });
  }

  if (file) {
    document.getElementById('uploadProgress').style.display = 'block';
    uploadToCloudinary(file)
      .then((url) => saveRequest(url, file.name))
      .then(() => {
        showSuccess('Request submitted with document!');
        document.getElementById('requestForm').reset();
        document.getElementById('uploadProgress').style.display = 'none';
        submitBtn.disabled = false;
      })
      .catch((err) => {
        showError(err.message);
        document.getElementById('uploadProgress').style.display = 'none';
        submitBtn.disabled = false;
      });
  } else {
    saveRequest(null, null)
      .then(() => {
        showSuccess('Request submitted!');
        document.getElementById('requestForm').reset();
        submitBtn.disabled = false;
      })
      .catch((err) => {
        showError(err.message);
        submitBtn.disabled = false;
      });
  }
});

function loadRequests(uid) {
  db.ref('requests/' + uid).on('value', (snap) => {
    const data = snap.val();
    const container = document.getElementById('requestsList');
    if (!data) {
      container.innerHTML = '<p>No requests yet.</p>';
      return;
    }
    const entries = Object.entries(data).sort((a, b) => (b[1].createdAt || 0) - (a[1].createdAt || 0));
    container.innerHTML = entries.map(([id, r]) => {
      const statusClass = 'status-' + (r.status || 'Pending').replace(/\s/g, '');
      const date = r.createdAt ? new Date(r.createdAt).toLocaleDateString() : '';
      const docLink = r.documentUrl ? `<p style="margin:4px 0 0;font-size:13px;"><a href="${r.documentUrl}" target="_blank">📎 ${r.documentName || 'View document'}</a></p>` : '';
      return `<div class="request-item">
        <strong>${r.service}</strong>
        <span class="status-pill ${statusClass}">${r.status || 'Pending'}</span>
        <p style="margin:6px 0 0;color:#555;font-size:14px;">${r.message || ''}</p>
        ${docLink}
        <p style="margin:4px 0 0;color:#999;font-size:12px;">${date}</p>
      </div>`;
    }).join('');
  });
}
</script>

</body>
</html>
