<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard | LAXMAN TELECOM</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="auth-style.css">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="favicon-180.png">
<link rel="shortcut icon" href="favicon.ico">
</head>
<body>
<header class="header">
  <div class="logo" style="display:flex; align-items:center; gap:14px;">
    <img src="laxman-telecom-icon-round.png" alt="Laxman Telecom logo" style="height:52px; width:52px;">
    <div>
      <h1>LAXMAN TELECOM</h1>
      <p>Admin Dashboard</p>
    </div>
  </div>
  <nav>
    <a href="index.html#home">Home</a>
  </nav>
</header>
<div class="dash-wrapper">
  <div class="dash-card">
    <div class="dash-top">
      <h2>All Service Requests</h2>
      <div style="display:flex; gap:10px; align-items:center;">
        <a href="telecom_settlement_invoice_dashboard_print_enhanced_26.html" class="logout-btn" style="text-decoration:none; display:inline-block;">Recharge Settlement Dashboard</a>
        <button class="logout-btn" onclick="doLogout()">Logout</button>
      </div>
    </div>
    <div id="adminContent"><p>Loading...</p></div>
  </div>
</div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
function doLogout() {
  auth.signOut().then(() => { window.location.href = 'login.html'; });
}
auth.onAuthStateChanged((user) => {
  if (!user || user.email !== ADMIN_EMAIL) {
    window.location.href = 'login.html';
    return;
  }
  loadAllRequests();
});
function loadAllRequests() {
  Promise.all([
    db.ref('requests').once('value'),
    db.ref('users').once('value')
  ]).then(([reqSnap, userSnap]) => {
    const requestsByUser = reqSnap.val() || {};
    const users = userSnap.val() || {};
    let rows = [];
    Object.entries(requestsByUser).forEach(([uid, userRequests]) => {
      const profile = users[uid] || {};
      Object.entries(userRequests).forEach(([reqId, r]) => {
        rows.push({ uid, reqId, profile, ...r });
      });
    });
    rows.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
    const container = document.getElementById('adminContent');
    if (rows.length === 0) {
      container.innerHTML = '<p>No requests yet.</p>';
      return;
    }
    let table = `<table class="admin-table">
      <tr><th>Customer</th><th>Contact</th><th>Service</th><th>Details</th><th>Date</th><th>Status</th></tr>`;
    rows.forEach((r) => {
      const date = r.createdAt ? new Date(r.createdAt).toLocaleString() : '';
      table += `<tr>
        <td>${r.profile.name || '(no name)'}</td>
        <td>${r.profile.email || ''}${r.profile.phone ? '<br>' + r.profile.phone : ''}</td>
        <td>${r.service}</td>
        <td>${r.message || ''}</td>
        <td>${date}</td>
        <td>
          <select onchange="updateStatus('${r.uid}','${r.reqId}',this.value)">
            <option ${r.status === 'Pending' ? 'selected' : ''}>Pending</option>
            <option ${r.status === 'In Progress' ? 'selected' : ''}>In Progress</option>
            <option ${r.status === 'Done' ? 'selected' : ''}>Done</option>
          </select>
        </td>
      </tr>`;
    });
    table += `</table>`;
    container.innerHTML = table;
  }).catch((err) => {
    document.getElementById('adminContent').innerHTML = '<p>Error loading requests: ' + err.message + '</p>';
  });
}
function updateStatus(uid, reqId, status) {
  db.ref('requests/' + uid + '/' + reqId).update({ status });
}
</script>
</body>
</html>
